<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#1a1f3a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2a2f4a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>

  <!-- node/data-flow motif -->
  <g stroke="#4f46e5" stroke-width="2" opacity="0.7">
    <line x1="920" y1="150" x2="1040" y2="230"/>
    <line x1="1040" y1="230" x2="960" y2="340"/>
    <line x1="1040" y1="230" x2="1120" y2="330"/>
    <line x1="960" y1="340" x2="1060" y2="440"/>
  </g>
  <g fill="#818cf8">
    <circle cx="920" cy="150" r="10"/>
    <circle cx="1040" cy="230" r="14"/>
    <circle cx="960" cy="340" r="10"/>
    <circle cx="1120" cy="330" r="8"/>
    <circle cx="1060" cy="440" r="10"/>
  </g>

  <text x="80" y="250" font-family="'Segoe UI', system-ui, sans-serif" font-size="34"
        font-weight="600" fill="#818cf8" letter-spacing="4">AI SOLUTIONS ARCHITECT · GENAI · AWS</text>
  <text x="78" y="345" font-family="'Segoe UI', system-ui, sans-serif" font-size="82"
        font-weight="700" fill="#ffffff" letter-spacing="-2">Michael Miller Jr.</text>
  <text x="80" y="420" font-family="'Segoe UI', system-ui, sans-serif" font-size="32"
        fill="#a0acc2">RAG and agentic AI on AWS, built with the guardrails,</text>
  <text x="80" y="462" font-family="'Segoe UI', system-ui, sans-serif" font-size="32"
        fill="#a0acc2">evaluation, and trust to ship it to production.</text>

  <g transform="translate(80,520)">
    <rect width="52" height="52" rx="12" fill="#4f46e5"/>
    <text x="26" y="35" font-family="'Segoe UI', system-ui, sans-serif" font-size="24"
          font-weight="700" fill="#ffffff" text-anchor="middle">MM</text>
  </g>
</svg>
